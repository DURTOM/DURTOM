; Copiá este archivo como config.ini y completalo.

[bidcom]
; Una URL de categoría por línea (las líneas con # se ignoran)
categorias =
    https://www.bidcom.com.ar/drones
    # https://www.bidcom.com.ar/otra-categoria
; No traer productos cuyo SKU empiece con (reacondicionados / importados)
excluir_prefijos = REF, USA
; Ofertas "Sólo por hoy" / "Finaliza en…": su precio vence en el día, no copiarlo
saltear_ofertas_relampago = true

[general]
carpeta_salida = salida

[scraper]
; Milisegundos de espera tras cada scroll (subir si la conexión es lenta)
espera_ms = 1500
max_paginas = 30
; Montos menores a esto se ignoran (evita tomar números sueltos como precio)
precio_minimo = 100
; Expresión que identifica el SKU en la tarjeta ("COD. DRDJI077")
; regex_sku = \bCOD[.:]\s*([A-Z0-9][A-Z0-9\-_/]{2,})

[woocommerce]
; true = actualiza la tienda directamente por API (sin importar CSV a mano)
activar = false
url = https://mitienda.com.ar
; WooCommerce > Ajustes > Avanzado > API REST > Añadir clave (permisos: Lectura/Escritura)
consumer_key = ck_xxxxxxxxxxxxxxxxxxxxxxxx
consumer_secret = cs_xxxxxxxxxxxxxxxxxxxxxxxx
; Si Bidcom no muestra descuento, borrar el precio rebajado en la tienda
borrar_rebaja_si_no_hay = true
incluir_variaciones = true
